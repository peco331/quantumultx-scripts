# 百度贴吧获取Cookie
# 使用说明：
# 1. 在QX中启用此重写规则
# 2. 打开百度贴吧App
# 3. 点击"我的"
# 4. 看到通知提示"Cookie获取成功"即可
# 5. 获取成功后可以禁用此规则

hostname = tieba.baidu.com

# 获取Cookie
^https:\/\/tieba\.baidu\.com(?::443)?\/mo\/q\/newmoindex(?:\?[^#]*)?$ url script-request-header https://raw.githubusercontent.com/peco331/quantumultx-scripts/6a4393d838a532afff714847c03fb9a42a908dce/scripts/tieba/tieba_signin.js
